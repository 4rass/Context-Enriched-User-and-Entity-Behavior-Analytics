[project]
name = "ce-ueba"
version = "0.1.0"
description = "Context-enriched UEBA academic Flask demonstration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=25.1,<26",
    "Flask==3.0.3",
    "flask-limiter[redis]>=4.1,<5",
    "flask-login>=0.6.3,<0.8",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-WTF==1.2.1",
    "SQLAlchemy==2.0.31",
]

[dependency-groups]
dev = ["pytest==8.2.2"]

[tool.uv]
package = false
