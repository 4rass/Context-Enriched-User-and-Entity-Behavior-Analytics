<text x="1368" y="406.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#334155">Reason + JSON context factors</text>
<text x="1368" y="440.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#334155">Commit records to SQLite</text>
