<text x="508" y="777.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#334155">Inspect employee risk profile</text>
<text x="508" y="811.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#334155">Choose an analyst status</text>
<text x="508" y="845.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#334155">Submit the review form</text>
<rect x="920" y="640" width="380" height="245" rx="12" fill="#ffffff"/>
<rect x="920" y="640" width="380" height="58" rx="12" fill="#b45309"/>
<text x="938" y="678.0" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#ffffff">Serve the SOC dashboard</text>
<text x="938" y="743.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#334155">Flask queries stored records</text>
<text x="938" y="777.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#334155">Apply the selected filters</text>
<text x="938" y="811.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#334155">Render metrics, alerts and charts</text>
<text x="938" y="845.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#334155">Open alert and user detail pages</text>
