<text x="60" y="71.80000000000001" font-family="Arial,sans-serif" font-size="40" font-weight="400" fill="#0f172a">CE-UEBA logical data flow</text>
<text x="60" y="116.16" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#334155">Implemented academic demo • Synthetic inputs • SQLite persistence • Human review</text>
<text x="60" y="191.24" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#0f766e">01  PREPARE AND SCORE  /  seed_data.py</text>
