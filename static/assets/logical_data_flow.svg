<text x="508" y="338.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#334155">Select employee and asset</text>
<text x="508" y="372.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#334155">Current / previous role</text>
<text x="508" y="406.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#334155">Query employee change tickets</text>
<text x="508" y="440.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#334155">Use event and evaluation times</text>
<rect x="920" y="235" width="380" height="245" rx="12" fill="#ffffff"/>
<rect x="920" y="235" width="380" height="58" rx="12" fill="#2563eb"/>
