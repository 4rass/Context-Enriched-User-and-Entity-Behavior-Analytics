<text x="1368" y="777.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#334155">change_tickets • behavioral_logs</text>
<text x="1368" y="811.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#334155">alerts: scores + review status</text>
<text x="1368" y="845.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#334155">instance/ce_ueba.db</text>
