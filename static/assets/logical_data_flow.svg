<text x="520" y="943.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#334155">Persist review status; later requests read the updated record</text>
<text x="60" y="1026.32" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#334155">Context records and behavioral logs are also stored in the same SQLite database during seeding.</text>
<text x="60" y="1057.32" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#334155">No live enterprise connectors or trained ML model. Analyst review changes status; it does not trigger rescoring.</text>
