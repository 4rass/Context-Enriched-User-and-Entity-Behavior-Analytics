<text x="938" y="338.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#334155">Match user, asset, ticket window</text>
<text x="938" y="372.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#334155">Apply legitimate / suspicious rules</text>
<text x="938" y="406.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#334155">Clamp score to 0–100</text>
<text x="938" y="440.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#334155">Derive severity and suppression</text>
