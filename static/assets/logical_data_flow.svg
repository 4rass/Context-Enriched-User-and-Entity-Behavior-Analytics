<rect x="60" y="235" width="380" height="58" rx="12" fill="#0f766e"/>
<text x="78" y="273.0" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#ffffff">Seed demo records</text>
<text x="78" y="338.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#334155">IAM / HR: users and roles</text>
<text x="78" y="372.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#334155">ITAM: asset inventory</text>
<text x="78" y="406.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#334155">ITSM: approved change tickets</text>
<text x="78" y="440.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#334155">Behavior: events + raw scores</text>
<rect x="490" y="235" width="380" height="245" rx="12" fill="#ffffff"/>
